name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Extract Python package version
        id: pkg_version
        run: |
          # Using python's tomllib (standard library in Python 3.11+)
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('app/pyproject.toml', 'rb'))['tool']['poetry']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: asaison
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |-
            asaison/cv-cat-api:${{ steps.pkg_version.outputs.version }}
            asaison/cv-cat-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
