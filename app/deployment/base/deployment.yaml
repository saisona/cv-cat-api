# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: app
    spec:
      nodeSelector:
        node: t3a_xlarge
        spot: "true"
      containers:
        - name: app
          image: app:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 4000mi
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /_status/healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_status/healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
              name: http
      restartPolicy: Always
---
