apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: app
    spec:
      nodeSelector:
        node: p4d_2xlarge
        spot: "true"
      containers:
        - name: app
          resources:
            limits:
              nvidia.com/gpu: 1 # requesting 1 GPU
