[project]
name = "cv-worker"
version = "0.1.0"
description = "Small CV API which gives propability of having a cat in a picture"
authors = [
    {name = "Alexandre Saison",email = "alexandre.saison.pro@gmail.com"}
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<3.14.1 || >3.14.1,<4.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
python-multipart = "^0.0.9"
pillow = "^10.2.0"
torch = "^2.13.0"
torchvision = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
black = "^24.2.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
